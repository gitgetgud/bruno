info:
  name: Возвращает информацию о ключе, его владельце и т.д.
  type: http
  seq: 1
  tags:
    - Info

http:
  method: POST
  url: "{{baseUrl}}/pkcs12/info"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Результат проверки подписей в XML
    request:
      url: "{{baseUrl}}/pkcs12/info"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
