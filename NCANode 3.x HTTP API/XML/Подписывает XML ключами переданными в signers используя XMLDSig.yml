info:
  name: Подписывает XML ключами переданными в signers используя XMLDSig
  type: http
  seq: 1
  tags:
    - XML

http:
  method: POST
  url: "{{baseUrl}}/xml/sign"
  body:
    type: json
    data: |-
      {
        "xml": "<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?><a><b>test</b></a>",
        "signers": [
          {
            "key": "",
            "password": "Qwerty12",
            "keyAlias": null
          }
        ],
        "clearSignatures": false,
        "trimXml": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Подписанный XML
    request:
      url: "{{baseUrl}}/xml/sign"
      method: POST
      body:
        type: json
        data: |-
          {
            "xml": "<?xml version=\\\"1.0\\\" encoding=\\\"utf-8\\\"?><a><b>test</b></a>",
            "signers": [
              {
                "key": "",
                "password": "Qwerty12",
                "keyAlias": null
              }
            ],
            "clearSignatures": false,
            "trimXml": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""

docs: |
  Этот метод может также добавлять подписи уже в существующий XML. Для этого,
  просто передайте в этот метод подписанную XML строку.
