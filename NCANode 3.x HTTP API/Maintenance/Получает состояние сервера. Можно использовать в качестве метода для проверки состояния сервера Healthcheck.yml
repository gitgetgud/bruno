info:
  name: Получает состояние сервера. Можно использовать в качестве метода для проверки состояния сервера Healthcheck.
  type: http
  seq: 1
  tags:
    - Maintenance

http:
  method: GET
  url: "{{baseUrl}}/actuator/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Информация о состоянии сервера
    request:
      url: "{{baseUrl}}/actuator/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "UP"
          }
